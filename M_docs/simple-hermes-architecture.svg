<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/>
</marker>
<style>text { font-family: Inter, PingFang SC, Microsoft YaHei, sans-serif; fill: #1e1e1e; }</style>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="68" font-size="28" fill="#1e1e1e">
<tspan x="60" dy="0">Simple Hermes 架构图</tspan>
</text>
<text x="60" y="96" font-size="18" fill="#475569">
<tspan x="60" dy="0">这是一个教学版的最小 Agent 系统：CLI 是外壳，SimpleAgent 是大脑，Tools/Memory/Session 是三块核心基础设施</tspan>
</text>
<rect x="90" y="170" width="250" height="110" rx="18" ry="18" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="125" y="226" font-size="24" fill="#1e1e1e">
<tspan x="125" dy="0">CLI</tspan>
<tspan x="125" dy="30.0">用户输入与输出界面</tspan>
</text>
<ellipse cx="590.0" cy="225.0" rx="160.0" ry="75.0" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
<text x="500" y="224" font-size="28" fill="#1e1e1e">
<tspan x="500" dy="0">SimpleAgent</tspan>
<tspan x="500" dy="35.0">最小 agent loop</tspan>
<tspan x="500" dy="35.0">规则式 planner</tspan>
</text>
<rect x="860" y="170" width="260" height="110" rx="18" ry="18" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="895" y="224" font-size="22" fill="#1e1e1e">
<tspan x="895" dy="0">ToolRegistry</tspan>
<tspan x="895" dy="27.5">统一注册与分发工具</tspan>
</text>
<polyline points="340,225 430,225" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="750,225 860,225" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="120" y="420" width="260" height="150" rx="18" ry="18" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="155" y="488" font-size="24" fill="#1e1e1e">
<tspan x="155" dy="0">MemoryStore</tspan>
<tspan x="155" dy="30.0">General Memory</tspan>
<tspan x="155" dy="30.0">User Memory</tspan>
</text>
<rect x="460" y="420" width="260" height="150" rx="18" ry="18" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="495" y="486" font-size="22" fill="#1e1e1e">
<tspan x="495" dy="0">SessionStore</tspan>
<tspan x="495" dy="27.5">SQLite 历史记录</tspan>
<tspan x="495" dy="27.5">append / history / search</tspan>
</text>
<rect x="800" y="420" width="320" height="150" rx="18" ry="18" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="840" y="484" font-size="20" fill="#1e1e1e">
<tspan x="840" dy="0">Built-in Tools</tspan>
<tspan x="840" dy="25.0">remember / remember_user / read / search / recall / summarize</tspan>
</text>
<polyline points="560,300 310,420" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="590,300 590,420" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="620,300 870,420" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="170" y="680" width="920" height="100" rx="18" ry="18" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="220" y="734" font-size="22" fill="#1e1e1e">
<tspan x="220" dy="0">教学重点：它保留了 Hermes 最重要的教学骨架——Agent、Registry、Memory、Session、CLI——但故意去掉了生产级复杂度</tspan>
</text>
</svg>