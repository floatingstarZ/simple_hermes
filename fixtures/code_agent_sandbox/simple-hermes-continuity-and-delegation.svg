<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1080" viewBox="0 0 1220 1080">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/>
</marker>
<style>text { font-family: Inter, PingFang SC, Microsoft YaHei, sans-serif; fill: #1e1e1e; }</style>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="68" font-size="28" fill="#1e1e1e">
<tspan x="60" dy="0">Simple Hermes：持续运行 + 多 Agent 雏形图</tspan>
</text>
<text x="60" y="98" font-size="18" fill="#475569">
<tspan x="60" dy="0">这张图展示 simple_hermes 新增的三条骨架：structured session metadata、child session lineage、tiny delegation summary return</tspan>
</text>
<rect x="100" y="170" width="320" height="130" rx="18" ry="18" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="140" y="236" font-size="26" fill="#1e1e1e">
<tspan x="140" dy="0">Parent SimpleAgent</tspan>
<tspan x="140" dy="32.5">主会话继续运行</tspan>
</text>
<rect x="480" y="170" width="320" height="130" rx="18" ry="18" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
<text x="520" y="234" font-size="24" fill="#1e1e1e">
<tspan x="520" dy="0">SessionStore</tspan>
<tspan x="520" dy="30.0">messages + kind + tool_name</tspan>
</text>
<rect x="860" y="170" width="280" height="130" rx="18" ry="18" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="900" y="234" font-size="24" fill="#1e1e1e">
<tspan x="900" dy="0">sessions table</tspan>
<tspan x="900" dy="30.0">parent_session_id + title</tspan>
</text>
<polyline points="420,235 480,235" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="800,235 860,235" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="210" y="430" width="320" height="140" rx="18" ry="18" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="250" y="498" font-size="24" fill="#1e1e1e">
<tspan x="250" dy="0">delegate tool</tspan>
<tspan x="250" dy="30.0">create_child_session()</tspan>
<tspan x="250" dy="30.0">spawn child SimpleAgent</tspan>
</text>
<rect x="650" y="430" width="320" height="140" rx="18" ry="18" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="690" y="496" font-size="22" fill="#1e1e1e">
<tspan x="690" dy="0">Child SimpleAgent</tspan>
<tspan x="690" dy="27.5">fresh child session</tspan>
<tspan x="690" dy="27.5">shared memory, isolated session_id</tspan>
</text>
<polyline points="530,500 650,500" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="690" width="580" height="120" rx="18" ry="18" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="350" y="748" font-size="24" fill="#1e1e1e">
<tspan x="350" dy="0">summary-only return</tspan>
<tspan x="350" dy="30.0">Parent 只拿 child summary，不把 child 全部轨迹直接回灌主上下文</tspan>
</text>
<polyline points="810,570 690,690" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="120" y="900" width="1020" height="100" rx="18" ry="18" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="160" y="952" font-size="20" fill="#1e1e1e">
<tspan x="160" dy="0">意义：simple_hermes 现在不只是一轮式工具调用器，而是开始拥有持续运行结构、多 session 谱系、子 agent 任务拆分和错误承受能力的骨架</tspan>
</text>
</svg>