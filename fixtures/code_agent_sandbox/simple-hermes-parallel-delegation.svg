<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/>
</marker>
<style>text { font-family: Inter, PingFang SC, Microsoft YaHei, sans-serif; fill: #1e1e1e; }</style>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<text x="60" y="68" font-size="28" fill="#1e1e1e">
<tspan x="60" dy="0">Simple Hermes：并发 delegation 雏形图</tspan>
</text>
<text x="60" y="96" font-size="18" fill="#475569">
<tspan x="60" dy="0">当子任务彼此独立时，simple_hermes 现在可以用 parallel_delegate 触发几个 child agents 并发执行，再把 summary 收回来</tspan>
</text>
<rect x="420" y="170" width="360" height="120" rx="18" ry="18" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="470" y="228" font-size="24" fill="#1e1e1e">
<tspan x="470" dy="0">Parent SimpleAgent</tspan>
<tspan x="470" dy="30.0">parallel_delegate task1 ; task2 ; task3</tspan>
</text>
<rect x="90" y="440" width="260" height="140" rx="18" ry="18" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
<text x="125" y="508" font-size="24" fill="#1e1e1e">
<tspan x="125" dy="0">Child A</tspan>
<tspan x="125" dy="30.0">child session A</tspan>
<tspan x="125" dy="30.0">own step budget</tspan>
</text>
<rect x="470" y="440" width="260" height="140" rx="18" ry="18" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
<text x="505" y="508" font-size="24" fill="#1e1e1e">
<tspan x="505" dy="0">Child B</tspan>
<tspan x="505" dy="30.0">child session B</tspan>
<tspan x="505" dy="30.0">own step budget</tspan>
</text>
<rect x="850" y="440" width="260" height="140" rx="18" ry="18" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
<text x="885" y="508" font-size="24" fill="#1e1e1e">
<tspan x="885" dy="0">Child C</tspan>
<tspan x="885" dy="30.0">child session C</tspan>
<tspan x="885" dy="30.0">own step budget</tspan>
</text>
<polyline points="540,290 260,440" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="600,290 600,440" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="660,290 980,440" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="360" y="670" width="480" height="110" rx="18" ry="18" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="410" y="728" font-size="24" fill="#1e1e1e">
<tspan x="410" dy="0">ThreadPoolExecutor</tspan>
<tspan x="410" dy="30.0">安全前提：只适合彼此独立的 child subtasks</tspan>
</text>
<polyline points="220,580 480,670" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="600,580 600,670" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="980,580 720,670" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="880" width="640" height="120" rx="18" ry="18" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="330" y="938" font-size="24" fill="#1e1e1e">
<tspan x="330" dy="0">Parent receives summary-only return</tspan>
<tspan x="330" dy="30.0">- task1 =&gt; summary</tspan>
<tspan x="330" dy="30.0">- task2 =&gt; summary</tspan>
<tspan x="330" dy="30.0">- task3 =&gt; summary</tspan>
</text>
<polyline points="600,780 600,880" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
</svg>